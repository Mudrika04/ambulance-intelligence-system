services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      AIS_MODE: ${AIS_MODE:-demo}
      AIS_DATABASE_URL: sqlite:///data/ais.db
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./configs:/app/configs

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE: http://localhost:8000
    depends_on:
      - backend
